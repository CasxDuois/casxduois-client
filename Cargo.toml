[workspace]
members = [
    "crates/casx_platform",
    "crates/casx_core",
    "crates/proto_1_12_2",
    "crates/proto_26_2",
]
resolver = "2"

[workspace.dependencies]
casx_platform = { path = "crates/casx_platform" }
casx_core = { path = "crates/casx_core" }
sysinfo = "0.31"
bytes = "1.7"
tokio = { version = "1.40", features = ["net", "io-util", "rt-multi-thread", "sync", "macros", "time"] }
thiserror = "1.0"
flate2 = "1.0"
rayon = "1.10"
crossbeam-channel = "0.5"
glam = "0.29"
bytemuck = { version = "1.18", features = ["derive"] }
aes = "0.8"
cfb8 = "0.8"
md-5 = "0.10"
sha1 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
winit = "0.30"
wgpu = "22.1"
egui = "0.29"
egui-winit = "0.29"
egui-wgpu = "0.29"
pollster = "0.3"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
